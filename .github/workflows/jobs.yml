name: Jobs test
on:
    push:
    workflow_dispatch:

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: |
          npm install --no-save html-validate
          npx html-validate "**/*.html"

  validate-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JS
        run: |
          for file in $(find . -name "*.js" -not -path "./node_modules/*"); do
            echo "Checking: $file"
            node --check "$file"
          done

  lint-js:
    needs: [validate-js, validate-html]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint JS with ESLint
        run: |
          npm install --no-save eslint @eslint/js globals
          cat > eslint.config.js << 'EOF'
          import js from "@eslint/js";
          import globals from "globals";
          export default [
            js.configs.recommended,
            {
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "module",
                globals: { ...globals.browser, ...globals.node },
              },
            },
          ];
          EOF
          npx eslint "**/*.js"
